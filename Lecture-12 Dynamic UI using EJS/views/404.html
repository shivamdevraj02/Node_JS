<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - Not Found</title>
        <style>
            :root{--bg:#0f2027;--bg2:#203a43;--accent:#ff6b6b}
            *{box-sizing:border-box}
            body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(135deg,var(--bg),var(--bg2));color:#fff}
            .card{text-align:center;background:rgba(255,255,255,0.06);padding:3rem;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);backdrop-filter: blur(6px);width:min(90%,600px)}
            h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 .5rem}
            p{margin:0 0 1.5rem;opacity:.9}
            .btn{display:inline-block;padding:.6rem 1rem;border-radius:8px;background:linear-gradient(90deg,var(--accent),#ff8e72);color:#fff;text-decoration:none;font-weight:600;box-shadow:0 6px 18px rgba(255,107,107,0.2)}
            @media(prefers-color-scheme:light){body{background:linear-gradient(135deg,#eaf0f6,#c9d6df);color:#042029}.card{background:rgba(255,255,255,0.8)}}
        </style>
    </head>
    <body>
        <div class="card">
            <h1>404</h1>
            <p>Page not found. The resource may have been moved or removed.</p>
            <a class="btn" href="/">Go Home</a>
        </div>
    </body>
    </html>
